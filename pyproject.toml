[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriflight"
version = "0.5.0"
description = "AgriFlight AI - data readiness foundation for agricultural drone-operation planning (capstone prototype)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "G. Maathangi (268469P)" }]
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8"]
# Tested with ortools 9.15.6755 on Python 3.14.7 (requires protobuf<6.34).
optimizer = ["ortools>=9.15,<9.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
